name: Conway 99 inspect 43 designs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and inspect DTRS archive
        run: |
          set -euxo pipefail
          url='https://webspace.maths.qmul.ac.uk/l.h.soicher/designtheory.org/database/t-designs/t2-v22-b77-r14-k4-L2.icgs.txt.bz2'
          curl -L --fail --retry 4 "$url" -o /tmp/designs.bz2
          sha256sum /tmp/designs.bz2
          bzip2 -dc /tmp/designs.bz2 > /tmp/designs.txt
          wc -c -l /tmp/designs.txt
          head -120 /tmp/designs.txt
          grep -o '<[^ >]*' /tmp/designs.txt | sort | uniq -c | sort -nr | head -80
