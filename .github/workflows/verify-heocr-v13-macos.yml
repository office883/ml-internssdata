name: Verify Hebrew OCR v13 on macOS

on:
  pull_request:
    paths:
      - 'tmp/heocr-v13-macos-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone exact source and verify tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch heocr-v13-source-verified https://github.com/office883/ml-internssdata.git /tmp/heocr-v13-macos
          cd /tmp/heocr-v13-macos
          test "$(git rev-parse 'HEAD^{tree}')" = '1ee1b63cfa8b1c8d68c7f216d513eb9aa1e0e7cb'
          uname -a
          python --version

      - name: Install native RAQM and build Pillow from source
        shell: bash
        run: |
          set -euo pipefail
          brew install pkg-config libraqm freetype jpeg-turbo openjpeg libtiff webp little-cms2
          export HOMEBREW_PREFIX="$(brew --prefix)"
          export CPPFLAGS="-I${HOMEBREW_PREFIX}/include -I$(brew --prefix freetype)/include -I$(brew --prefix jpeg-turbo)/include"
          export LDFLAGS="-L${HOMEBREW_PREFIX}/lib -L$(brew --prefix freetype)/lib -L$(brew --prefix jpeg-turbo)/lib"
          export PKG_CONFIG_PATH="${HOMEBREW_PREFIX}/lib/pkgconfig:${HOMEBREW_PREFIX}/share/pkgconfig:$(brew --prefix libraqm)/lib/pkgconfig:$(brew --prefix freetype)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig"
          pkg-config --modversion raqm
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir --no-binary Pillow 'Pillow==12.2.0'
          python - <<'PY'
          from PIL import features
          assert features.check_feature('raqm'), features.get_supported_features()
          print('RAQM', features.version_feature('raqm'))
          print('FRIBIDI', features.version_feature('fribidi'))
          print('HARFBUZZ', features.version_feature('harfbuzz'))
          PY

      - name: Install remaining pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/heocr-v13-macos
          python -m pip install --requirement requirements-lock.txt
          python -m pip install --no-deps --editable .

      - name: Run complete macOS test suite
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/heocr-v13-macos
          python -m compileall -q heocr_unified tests
          bash -n RUN_ME.command
          git diff --check
          python -m pytest -q --disable-warnings | tee /tmp/heocr-v13-macos-tests.txt
          grep -Eq '[0-9]+ passed' /tmp/heocr-v13-macos-tests.txt
          if grep -q 'skipped' /tmp/heocr-v13-macos-tests.txt; then
            echo 'Unexpected skipped tests on macOS' >&2
            exit 1
          fi
          echo HEOCR_V13_MACOS_RAQM_RUNTIME_PASS
